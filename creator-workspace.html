<!doctype html>
<html lang="zh-CN" data-theme="lace">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>颜婕的账号工作台</title>
<style>
/* ============================================================
   三套主题变量
   ============================================================ */
:root,[data-theme="lace"]{
  --bg:#FDF8E4; --bg2:#FFF2F1; --panel:#FFFDF9; --card:#FFFFFF;
  --ink:#5A4042; --ink2:#825B5C; --muted:#AE9694;
  --line:#F0DADB; --line2:#E6C9CB;
  --accent:#E9A2B3; --accent-soft:#FED4D5; --accent2:#FFF9C5; --accent3:#F9E2EA; --accent-ink:#7A4A50;
  --radius:20px; --radius-s:12px; --bw:1.5px;
  --shadow:0 6px 18px rgba(130,91,92,.09); --shadow-h:0 12px 28px rgba(130,91,92,.16);
  --side-bg:#FFF0F1; --side-ink:#6B4B4D; --side-muted:#B79B9D; --nav-active:#FED4D5; --nav-ink:#7A4A50;
  --danger:#D9707B; --ok:#79A988; --warn:#D3A044;
  --font:"Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --deco-op:.5;
}
[data-theme="forest"]{
  --bg:#EDF2DF; --bg2:#DFEACB; --panel:#FFFDF0; --card:#FFFDF0;
  --ink:#1E3326; --ink2:#3B5A43; --muted:#77896F;
  --line:#2C4A34; --line2:#8AA67C;
  --accent:#3F7D4F; --accent-soft:#CBE3B4; --accent2:#E9C46A; --accent3:#A7CE88; --accent-ink:#FFFFFF;
  --radius:0px; --radius-s:0px; --bw:2px;
  --shadow:4px 4px 0 #2C4A34; --shadow-h:6px 6px 0 #2C4A34;
  --side-bg:#24432F; --side-ink:#EAF5DE; --side-muted:#A9C49C; --nav-active:#3F7D4F; --nav-ink:#FFFFFF;
  --danger:#C4553F; --ok:#3F7D4F; --warn:#B4831E;
  --font:"Courier New",ui-monospace,"Microsoft YaHei",monospace;
  --deco-op:.32;
}
[data-theme="doodle"]{
  --bg:#FCFFFB; --bg2:#EFF9F2; --panel:#FFFFFF; --card:#FFFFFF;
  --ink:#36483F; --ink2:#5A7062; --muted:#96A99B;
  --line:#BED9C7; --line2:#D9EBDE;
  --accent:#79C4A4; --accent-soft:#D5F7CB; --accent2:#C7F9FF; --accent3:#DAFBFF; --accent-ink:#2F5B49;
  --radius:18px; --radius-s:12px; --bw:2px;
  --shadow:3px 4px 0 rgba(94,145,115,.13); --shadow-h:5px 7px 0 rgba(94,145,115,.2);
  --side-bg:#F2FBF5; --side-ink:#3D5547; --side-muted:#8FA79A; --nav-active:#D5F7CB; --nav-ink:#2F5B49;
  --danger:#D98A80; --ok:#79C4A4; --warn:#C9A64C;
  --font:"Comic Sans MS","Kaiti SC","STKaiti","PingFang SC","Microsoft YaHei",sans-serif;
  --deco-op:.75;
}

/* ============================================================
   基础
   ============================================================ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);overflow-x:hidden;
  transition:background-color .4s ease,color .4s ease;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* 背景纹理 */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity .4s}
[data-theme="lace"] #bgfx{
  background:
    radial-gradient(circle at 12% 12%,rgba(254,212,213,.55),transparent 38%),
    radial-gradient(circle at 88% 6%,rgba(255,249,197,.6),transparent 34%),
    radial-gradient(circle at 78% 90%,rgba(249,226,234,.6),transparent 40%),
    radial-gradient(circle,rgba(130,91,92,.055) 1.2px,transparent 1.3px) 0 0/22px 22px;
}
[data-theme="forest"] #bgfx{
  background:
    linear-gradient(rgba(44,74,52,.055) 1px,transparent 1px) 0 0/16px 16px,
    linear-gradient(90deg,rgba(44,74,52,.055) 1px,transparent 1px) 0 0/16px 16px,
    radial-gradient(circle at 85% 10%,rgba(203,227,180,.55),transparent 40%);
}
[data-theme="doodle"] #bgfx{
  background:
    radial-gradient(circle at 8% 8%,rgba(213,247,203,.5),transparent 36%),
    radial-gradient(circle at 92% 84%,rgba(199,249,255,.5),transparent 38%),
    radial-gradient(circle at 60% 0%,rgba(251,255,219,.6),transparent 34%);
}
#deco{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:var(--deco-op)}
.deco-item{position:absolute;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(3deg)}}

/* ============================================================
   骨架
   ============================================================ */
.app{display:flex;min-height:100vh;position:relative;z-index:2}
.sidebar{width:238px;flex:0 0 238px;background:var(--side-bg);border-right:var(--bw) solid var(--line);
  height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:22px 16px 16px;
  transition:background-color .4s,border-color .4s;z-index:22}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand-mark{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;font-size:20px;
  background:var(--accent-soft);border:var(--bw) solid var(--line);border-radius:var(--radius-s);box-shadow:var(--shadow)}
.brand-txt b{display:block;font-size:15px;letter-spacing:.3px;line-height:1.2;color:var(--side-ink)}
.brand-txt span{font-size:10.5px;color:var(--side-muted);letter-spacing:1.4px;text-transform:uppercase}

.acct-card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);
  padding:12px 13px;margin-bottom:18px;box-shadow:var(--shadow)}
.acct-card .lab{font-size:10.5px;color:var(--muted);letter-spacing:1px;margin-bottom:7px}
.acct-row{display:flex;align-items:center;gap:8px}
.acct-av{width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;border-radius:50%;
  background:var(--accent-soft);font-size:16px;border:var(--bw) solid var(--line)}
.acct-meta{min-width:0;flex:1}
.acct-meta b{display:block;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-meta small{font-size:10.5px;color:var(--muted)}
.acct-prog{height:7px;background:var(--bg2);border-radius:20px;margin-top:10px;overflow:hidden;border:1px solid var(--line)}
.acct-prog i{display:block;height:100%;background:var(--accent);border-radius:20px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.acct-card .prog-txt{font-size:10.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}

.nav{display:flex;flex-direction:column;gap:5px;flex:1;overflow-y:auto;padding-right:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-s);
  color:var(--side-ink);font-size:13.5px;font-weight:600;border:var(--bw) solid transparent;
  transition:transform .22s,background-color .22s,box-shadow .22s,color .22s;width:100%;text-align:left}
.nav-item .ico{font-size:17px;width:22px;text-align:center}
.nav-item .cnt{margin-left:auto;font-size:10.5px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;
  border-radius:20px;background:var(--accent-soft);color:var(--ink2);font-weight:700}
.nav-item:hover{transform:translateX(4px);background:var(--card)}
.nav-item.on{background:var(--nav-active);color:var(--nav-ink);border-color:var(--line);box-shadow:var(--shadow)}
.nav-item.on .cnt{background:var(--card);color:var(--ink2)}
.side-bottom{border-top:var(--bw) dashed var(--line2);padding-top:14px;margin-top:12px}
.side-label{font-size:10.5px;color:var(--side-muted);letter-spacing:1px;margin:0 4px 9px}
.swatches{display:flex;gap:8px;margin:0 4px 14px}
.swatch{width:36px;height:36px;border-radius:var(--radius-s);border:var(--bw) solid var(--line);
  position:relative;transition:transform .2s,box-shadow .2s;overflow:hidden;box-shadow:var(--shadow)}
.swatch:hover{transform:translateY(-3px)}
.swatch.on{outline:2px solid var(--accent);outline-offset:2px}
.swatch i{position:absolute;inset:0;display:block}
.swatch em{position:absolute;bottom:0;left:0;right:0;font-style:normal;font-size:8px;text-align:center;
  background:rgba(255,255,255,.8);color:#4a4a4a;line-height:12px}
.side-tools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:21;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:var(--bw) solid var(--line);padding:11px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  transition:background-color .4s,border-color .4s}
.crumb{font-size:12px;color:var(--muted);white-space:nowrap}
.crumb b{color:var(--ink);font-size:14px;margin-left:4px}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acct-switch{display:flex;gap:4px;background:var(--panel);border:var(--bw) solid var(--line);
  border-radius:30px;padding:3px;box-shadow:var(--shadow)}
.acct-chip{display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:30px;font-size:12.5px;
  font-weight:700;color:var(--ink2);transition:background-color .25s,color .25s,transform .2s;white-space:nowrap}
.acct-chip:hover{transform:translateY(-1px)}
.acct-chip.on{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.theme-switch{display:flex;gap:5px;align-items:center}
.theme-dot{width:26px;height:26px;border-radius:50%;border:var(--bw) solid var(--line);
  box-shadow:var(--shadow);transition:transform .2s,outline .2s;position:relative}
.theme-dot:hover{transform:scale(1.12) rotate(12deg)}
.theme-dot.on{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--radius-s);
  border:var(--bw) solid var(--line);background:var(--panel);font-size:15px;box-shadow:var(--shadow);
  transition:transform .2s,box-shadow .2s}
.icon-btn:hover{transform:rotate(12deg) scale(1.06);box-shadow:var(--shadow-h)}
.saved{font-size:10.5px;color:var(--ok);display:flex;align-items:center;gap:4px;white-space:nowrap;opacity:.85}
.saved.pulse{animation:pulse .7s ease}
@keyframes pulse{0%{transform:scale(.9);opacity:.4}45%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:.85}}
.mobile-nav{display:none}
.view-wrap{padding:24px 28px 70px;width:100%;max-width:1280px;margin:0 auto}
#view.enter{animation:viewIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ============================================================
   通用组件
   ============================================================ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:25px;margin:0 0 5px;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
.page-head p{margin:0;font-size:12.5px;color:var(--muted)}
.page-head .eyebrow{font-size:10.5px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;font-weight:800}
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;transition:transform .25s,box-shadow .25s,border-color .4s,background-color .4s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.panel{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;transition:background-color .4s,border-color .4s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--radius-s);
  border:var(--bw) solid var(--line);background:var(--panel);color:var(--ink);font-size:12.5px;font-weight:700;
  box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,background-color .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.btn:active{transform:translateY(1px) scale(.98);box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.ghost{box-shadow:none;background:transparent;border-color:var(--line2)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:11.5px}
.icon-btn.sm{width:28px;height:28px;font-size:12px}
.chip,.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:30px;font-size:10.5px;
  font-weight:700;background:var(--accent-soft);color:var(--ink2);border:1px solid var(--line2);white-space:nowrap}
.pill.alt{background:var(--accent2)}
.pill.blue{background:var(--accent3)}
.pill.done{background:var(--accent-soft);color:var(--ok)}
.pill.warn{background:var(--accent2);color:var(--warn)}
.muted{color:var(--muted)}
.tiny{font-size:10.5px}
.sec-title{font-size:15px;font-weight:800;margin:0 0 13px;display:flex;align-items:center;gap:8px}
.sec-title .more{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.sec-title .more:hover{color:var(--accent)}
.divider{height:1px;background:var(--line);margin:16px 0;opacity:.6}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}
.stat{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:15px 16px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.stat .lab{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.stat .val{font-size:23px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.stat .sub{font-size:10.5px;color:var(--muted);margin-top:5px}
.stat .bubble{position:absolute;right:-12px;top:-12px;width:64px;height:64px;border-radius:50%;background:var(--accent-soft);opacity:.5}
.progress{height:9px;background:var(--bg2);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent);border-radius:20px;transition:width .9s cubic-bezier(.2,.8,.2,1)}

.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 14px;font-size:12px;font-weight:700;border-radius:30px;border:var(--bw) solid var(--line);
  background:var(--panel);color:var(--ink2);transition:transform .2s,background-color .2s,color .2s}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.search{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--panel);
  border:var(--bw) solid var(--line);border-radius:30px;padding:7px 14px;box-shadow:var(--shadow);min-width:190px}
.search input{border:none;outline:none;background:transparent;width:100%;font-size:12px}
.input{width:100%;background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--radius-s);
  padding:10px 12px;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s,background-color .4s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;line-height:1.65;min-height:78px}
input[type="file"].input{padding:8px;font-size:11.5px}

.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:var(--bw) solid var(--line);
  border-radius:var(--radius-s);padding:13px 15px;box-shadow:var(--shadow);transition:transform .22s,box-shadow .22s,opacity .3s;cursor:pointer}
.li:hover{transform:translateX(4px);box-shadow:var(--shadow-h)}
.li-main{flex:1;min-width:0}
.li-title{font-size:13.5px;font-weight:700;line-height:1.45;word-break:break-word}
.li-sub{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.li-actions{display:flex;gap:6px;align-items:center;opacity:.55;transition:opacity .2s}
.li:hover .li-actions{opacity:1}
.check{width:21px;height:21px;flex:0 0 21px;margin-top:2px;border:var(--bw) solid var(--line);
  border-radius:6px;background:var(--panel);display:grid;place-items:center;font-size:12px;
  transition:transform .2s,background-color .2s;color:transparent}
.check:hover{transform:scale(1.15)}
.check.on{background:var(--accent);color:var(--accent-ink);animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
.li.done .li-title{text-decoration:line-through;opacity:.5}
.prio{width:7px;height:7px;border-radius:50%;flex:0 0 7px;display:inline-block}
.prio.高{background:var(--danger)} .prio.中{background:var(--warn)} .prio.低{background:var(--ok)}

.insp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;align-items:start}
.insp-card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:15px;display:flex;flex-direction:column;gap:10px;cursor:pointer;
  transition:transform .25s,box-shadow .25s;overflow:hidden;position:relative}
.insp-card:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:var(--shadow-h)}
.insp-card h3{margin:0;font-size:14px;line-height:1.45;word-break:break-word}
.insp-body{font-size:12px;color:var(--ink2);line-height:1.65;white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.insp-foot{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:9px;border-top:1px dashed var(--line2);
  font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.star{margin-left:auto;font-size:15px;color:var(--muted);transition:transform .25s,color .2s}
.star:hover{transform:scale(1.3) rotate(15deg)}
.star.on{color:#E9B44C}
.link-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);
  border:var(--bw) dashed var(--line2);border-radius:var(--radius-s);transition:transform .2s,background-color .2s}
a.link-card:hover{transform:translateY(-2px);background:var(--accent-soft)}
.link-ico{width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;border-radius:9px;
  background:var(--accent-soft);font-weight:800;font-size:14px;color:var(--accent-ink)}
.link-meta{min-width:0;flex:1}
.link-meta b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-meta small{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.video-box{border:var(--bw) solid var(--line2);border-radius:var(--radius-s);overflow:hidden;background:var(--bg2);position:relative}
.video-box .vp{display:block;width:100%;aspect-ratio:16/9;border:0;background:#1b1b1b}
.video-box.lg .vp{aspect-ratio:16/9}
.video-empty{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-size:11px;color:var(--muted);text-align:center;padding:12px;background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 10px,var(--bg2) 10px,var(--bg2) 20px)}
.video-empty span:first-child{font-size:24px}
.video-box.missing::after{content:"本地视频读取失败";position:absolute;inset:auto 0 0 0;font-size:10px;
  text-align:center;background:var(--danger);color:#fff;padding:3px}

.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.bar-track{flex:1;width:100%;max-width:46px;display:flex;align-items:flex-end;background:var(--bg2);
  border-radius:8px 8px 0 0;overflow:hidden;border:1px solid var(--line2)}
.bar-fill{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent3));border-radius:8px 8px 0 0;
  transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.bar-val{font-size:10px;font-weight:700;margin-top:6px;white-space:nowrap}
.bar-lab{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h{text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;padding:4px 0}
.cal-cell{min-height:74px;background:var(--card);border:var(--bw) solid var(--line2);border-radius:var(--radius-s);
  padding:6px;cursor:pointer;transition:transform .2s,background-color .2s,border-color .2s;display:flex;flex-direction:column;gap:3px}
.cal-cell:hover{transform:translateY(-2px);border-color:var(--accent)}
.cal-cell.empty{opacity:.3;cursor:default;background:transparent;border-color:transparent}
.cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-cell.sel{background:var(--accent-soft)}
.cal-num{font-size:11.5px;font-weight:800}
.cal-dot{font-size:9.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:2px 4px;border-radius:5px;background:var(--accent-soft);color:var(--ink2)}
.cal-dot.b{background:var(--accent3)} .cal-dot.c{background:var(--accent2)}

.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.metric{background:var(--bg2);border-radius:var(--radius-s);padding:9px 8px;text-align:center}
.metric b{display:block;font-size:14px}
.metric small{font-size:9.5px;color:var(--muted)}
.amount{font-size:16px;font-weight:800;white-space:nowrap}
.amount.in{color:var(--ok)} .amount.pending{color:var(--warn)}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:46px 20px;text-align:center;
  border:var(--bw) dashed var(--line2);border-radius:var(--radius);background:var(--panel);color:var(--muted)}
.empty .e-ico{font-size:38px;animation:float 5s ease-in-out infinite}
.empty b{color:var(--ink);font-size:14px}
.notice{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:var(--radius-s);
  background:var(--accent2);border:var(--bw) solid var(--line2);font-size:11.5px;margin-bottom:18px;color:var(--ink2)}
.notice .btn{margin-left:auto}

/* 首页 */
.hero{position:relative;overflow:hidden;background:var(--panel);border:var(--bw) solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;margin-bottom:20px}
.hero h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
.hero p{margin:0;font-size:12.5px;color:var(--ink2)}
.hero .hero-tag{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:700;
  background:var(--accent-soft);padding:5px 12px;border-radius:30px;margin-bottom:12px;border:1px solid var(--line2)}
.hero-art{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:72px;opacity:.9;
  animation:float 7s ease-in-out infinite;pointer-events:none}
.hero .dots{position:absolute;inset:0;pointer-events:none;opacity:.5}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.quick{display:flex;align-items:center;gap:11px;background:var(--card);border:var(--bw) solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;cursor:pointer;text-align:left;
  transition:transform .25s,box-shadow .25s}
.quick:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.quick .q-ico{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;font-size:20px;
  border-radius:var(--radius-s);background:var(--accent-soft);border:1px solid var(--line2)}
.quick b{display:block;font-size:12.5px}
.quick small{font-size:10.5px;color:var(--muted)}
.quick-add{display:flex;gap:8px;margin-top:12px}
.quick-add input{flex:1;min-width:0}

/* 抽屉 / 弹层 */
#drawerRoot{position:relative;z-index:60}
.backdrop{position:fixed;inset:0;background:rgba(40,30,35,.42);backdrop-filter:blur(3px);
  animation:fadeIn .25s ease both;z-index:60}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);
  border-left:var(--bw) solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.16);z-index:61;
  display:flex;flex-direction:column;animation:slideIn .34s cubic-bezier(.2,.85,.25,1) both}
@keyframes slideIn{from{transform:translateX(100%);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{padding:20px 22px 15px;border-bottom:var(--bw) solid var(--line);display:flex;align-items:flex-start;gap:12px;background:var(--panel)}
.drawer-head .eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--accent);font-weight:800;margin-bottom:5px}
.drawer-head h3{margin:0;font-size:18px;line-height:1.35;word-break:break-word}
.drawer-head .icon-btn{margin-left:auto;flex:0 0 34px}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px 26px}
.drawer-foot{padding:13px 22px;border-top:var(--bw) solid var(--line);background:var(--panel);
  display:flex;gap:9px;align-items:center;justify-content:space-between}
.drawer-foot .right{display:flex;gap:8px;margin-left:auto}
.save-note{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ok);background:var(--accent-soft);
  border-radius:var(--radius-s);padding:9px 12px;margin-bottom:16px;font-weight:700}
.field{margin-bottom:15px}
.field>label{display:block;font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:7px;letter-spacing:.3px}
.hint{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.linkbtn{color:var(--accent);font-weight:800;text-decoration:underline;font-size:10.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg-b{padding:8px 14px;border-radius:30px;border:var(--bw) solid var(--line);background:var(--panel);
  font-size:12px;font-weight:700;transition:transform .2s,background-color .2s}
.seg-b:hover{transform:translateY(-2px)}
.seg-b.on{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.switch{display:inline-flex;align-items:center;cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch span{width:44px;height:25px;border-radius:30px;background:var(--line2);border:var(--bw) solid var(--line);
  position:relative;transition:background-color .25s}
.switch span::after{content:"";position:absolute;left:3px;top:2px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(19px)}
.preview-box{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line2)}
.preview-box .lab{font-size:11px;font-weight:800;color:var(--ink2);margin-bottom:9px}
.setting-block{margin-bottom:22px}
.setting-block h4{margin:0 0 11px;font-size:13px;display:flex;align-items:center;gap:7px}
.setting-block .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

#toastRoot{position:fixed;right:22px;bottom:22px;z-index:90;display:flex;
  flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:12px;
  font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2) both;
  display:flex;align-items:center;gap:7px;max-width:88vw}
.toast.warn{background:var(--warn);color:#fff}
.toast.err{background:var(--danger);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .3s ease both}
@keyframes toastOut{to{opacity:0;transform:translateY(12px) scale(.95)}}
#sweep{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,var(--accent-soft),transparent 62%)}
#sweep.go{animation:sweep .65s ease-out both}
@keyframes sweep{0%{opacity:0;transform:scale(.4)}35%{opacity:.65}100%{opacity:0;transform:scale(2.2)}}

[data-theme="forest"] .sidebar,[data-theme="forest"] .card,[data-theme="forest"] .panel,

[data-theme="lace"] .sec-title::after{content:"✧";color:var(--accent);font-size:13px}

[data-theme="doodle"] .card,[data-theme="doodle"] .panel,[data-theme="doodle"] .hero,

<script>
/* ============================================================
   0. 基础工具
   ============================================================ */
const KEY='creatorWorkspace.v1';
const $= (s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const pad=n=>String(n).padStart(2,'0');
const dstr=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr();
const num=n=>Number(n)||0;
const money=n=>'¥'+num(n).toLocaleString('zh-CN',{maximumFractionDigits:2});
const shortNum=n=>{const v=num(n);return v>=10000?(v/10000).toFixed(1)+'w':v>=1000?(v/1000).toFixed(1)+'k':String(v)};
const byNewest=(a,b)=>(b.createdAt||0)-(a.createdAt||0);
const monthOf=s=>String(s||'').slice(0,7);
const safeUrl=u=>{try{const x=new URL(String(u).trim());return ['http:','https:'].includes(x.protocol)?x.href:''}catch(e){return ''}};

const NAV=[
  ['home','🏠','首页'],['todo','✅','待办'],['insp','💡','灵感'],['script','📝','脚本'],
  ['review','⭐','复盘'],['schedule','📅','档期'],['revenue','💰','收益']
];
const KMAP={todos:'todo',inspirations:'insp',scripts:'script',reviews:'review',schedules:'schedule',revenues:'revenue'};
const KLABEL={todos:'待办',inspirations:'灵感',scripts:'脚本',reviews:'复盘',schedules:'档期',revenues:'收益'};
const THEMES=[
  {id:'forest',name:'森森绿意',sub:'像素森林',css:'linear-gradient(135deg,#24432F 0 40%,#3F7D4F 40% 70%,#CBE3B4 70%)'},
  {id:'lace',name:'蕾丝韩系',sub:'少女奶油',css:'linear-gradient(135deg,#FED4D5 0 34%,#FDF8E4 34% 67%,#825B5C 67%)'},
  {id:'doodle',name:'手绘插画',sub:'清爽涂鸦',css:'linear-gradient(135deg,#D5F7CB 0 34%,#DAFBFF 34% 67%,#FBFFDB 67%)'}
];
const PLATFORMS=['小红书','抖音','B站','视频号','公众号','其他'];

/* ============================================================
   1. 数据层：localStorage 即时持久化
   ============================================================ */
function emptyData(){return {todos:[],inspirations:[],scripts:[],reviews:[],schedules:[],revenues:[]}}
function defaultState(){
  return {
    v:2,theme:'lace',active:'a1',sampleNotice:false,
    accounts:[
      {id:'a1',name:'账号一',platform:'小红书',handle:'',followers:0,target:10000,emoji:'🌷'},
      {id:'a2',name:'账号二',platform:'B站',handle:'',followers:0,target:5000,emoji:'🎬'}
    ],
    data:{a1:emptyData(),a2:emptyData()}
  };
}
let S;
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return defaultState();
    const o=JSON.parse(raw), def=defaultState();
    o.accounts=Array.isArray(o.accounts)&&o.accounts.length?o.accounts:def.accounts;
    o.data=o.data&&typeof o.data==='object'?o.data:def.data;
    o.accounts.forEach(a=>{if(!o.data[a.id])o.data[a.id]={todos:[],inspirations:[],scripts:[],reviews:[],schedules:[],revenues:[]};
      ['todos','inspirations','scripts','reviews','schedules','revenues'].forEach(k=>{if(!Array.isArray(o.data[a.id][k]))o.data[a.id][k]=[]})});
    // 清理旧版本内置的虚构示例数据：只删除带 sample 标记的条目，保留自己新增的内容
    o.accounts.forEach(a=>{
      ['todos','inspirations','scripts','reviews','schedules','revenues'].forEach(k=>{
        o.data[a.id][k]=o.data[a.id][k].filter(x=>!x.sample);
      });
      // 若账号资料仍是初始的假昵称 + 假粉丝数（两者都未改过），一并重置
      const seed={a1:{handle:'@我的日常',followers:1280},a2:{handle:'@慢生活实验室',followers:640}}[a.id];
      if(seed&&a.handle===seed.handle&&Number(a.followers)===seed.followers){a.handle='';a.followers=0}
    });
    o.sampleNotice=false;o.v=2;
    if(!o.accounts.some(a=>a.id===o.active))o.active=o.accounts[0].id;
    if(!THEMES.some(t=>t.id===o.theme))o.theme='lace';
    return o;
  }catch(e){ return defaultState(); }
}

/* 本地视频：IndexedDB 存储 Blob，localStorage 只存引用 */
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('cw-media',1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('blobs'))r.result.createObjectStore('blobs')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
async function putBlob(k,b){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('blobs','readwrite');t.objectStore('blobs').put(b,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function getBlob(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('blobs','readonly');const q=t.objectStore('blobs').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function delBlob(k){try{const db=await idb();const t=db.transaction('blobs','readwrite');t.objectStore('blobs').delete(k)}catch(e){}}
const videoURLs=new Map();
async function hydrateVideos(root){
  const els=$$('[data-video-key]',root||document);
  for(const el of els){
    const k=el.dataset.videoKey;
    if(videoURLs.has(k)){el.src=videoURLs.get(k);continue}
    try{
      const b=await getBlob(k);
      if(b){const u=URL.createObjectURL(b);videoURLs.set(k,u);el.src=u}
      else el.closest('.video-box')?.classList.add('missing');
    }catch(e){el.closest('.video-box')?.classList.add('missing')}
  }
}

function videoInfo(url){
  const u=String(url||'').trim();
  if(!u)return {k:'empty'};
  if(/\.(mp4|webm|ogg|mov|m4v)(\?|#|$)/i.test(u))return {k:'file',src:u};
  let m=u.match(/bilibili\.com\/video\/(BV[\w]+)/i);
  if(m)return {k:'iframe',src:'https://player.bilibili.com/player.html?bvid='+m[1]+'&page=1&high_quality=1'};
  if(/player\.bilibili\.com/i.test(u))return {k:'iframe',src:u};
  m=u.match(/(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]+)/i);
  if(m)return {k:'iframe',src:'https://www.youtube.com/embed/'+m[1]};
  if(/youtube\.com\/embed\//i.test(u))return {k:'iframe',src:u};
  if(/^https?:\/\//i.test(u)&&/(player|embed)/i.test(u))return {k:'iframe',src:u};
  return {k:'link',src:safeUrl(u)||u};
}

function lastMonths(n){
  const out=[],d=new Date();d.setDate(1);
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+'-'+pad(x.getMonth()+1))}
  return out;
}

function fieldHTML(f,item){
  if(f.when&&!f.when(item))return '';
  const v=item[f.k]==null?'':item[f.k];
  let inner='';
  switch(f.t){
    case 'textarea': inner='<textarea class="input" data-f="'+f.k+'" rows="4" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';break;
    case 'select': inner='<select class="input" data-f="'+f.k+'">'+f.o.map(o=>'<option value="'+esc(o)+'" '+(String(o)===String(v)?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';break;
    case 'segment': inner='<div class="seg">'+f.o.map(o=>'<button type="button" class="seg-b '+(v===o[0]?'on':'')+'" data-act="seg" data-f="'+f.k+'" data-v="'+esc(o[0])+'">'+esc(o[1])+'</button>').join('')+'</div>';break;
    case 'switch': inner='<label class="switch"><input type="checkbox" data-f="'+f.k+'" '+(v?'checked':'')+'><span></span></label>';break;
    case 'file': inner='<input type="file" accept="video/*" class="input" data-f="'+f.k+'"><div class="hint">'+
      (item.videoLocal?'已保存本地视频：<b>'+esc(item.videoName||'视频')+'</b> · <button class="linkbtn" data-act="clear-video">移除</button>':
       item.videoData?'已保存精简视频 · <button class="linkbtn" data-act="clear-video">移除</button>':'视频保存在浏览器本地，关掉页面再打开依然在（建议 ≤ 20MB）')+'</div>';break;
    case 'relinsp': inner='<select class="input" data-f="'+f.k+'"><option value="">不关联</option>'+
      D().inspirations.map(i=>'<option value="'+esc(i.id)+'" '+(i.id===v?'selected':'')+'>'+esc(i.title||'未命名灵感')+'</option>').join('')+'</select>';break;
    default: inner='<input class="input" type="'+f.t+'" data-f="'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"'+(f.t==='number'?' step="0.01" min="0"':'')+'>';
  }
  return '<div class="field"><label>'+esc(f.l)+'</label>'+inner+'</div>';
}
function editorPreview(item){

  if(item.type==='link'&&item.url)return '<div class="preview-box"><div class="lab">🔗 外链预览</div>'+linkCardHTML(item.url)+'</div>';
  if(item.type==='video')return '<div class="preview-box"><div class="lab">🎬 视频预览</div>'+videoHTML(item,true)+'</div>';

  item[f]=v;item.updatedAt=Date.now();save();

  if(ed.key==='inspirations'&&(f==='url'||f==='type'||f==='videoFile')){

function createItem(kind,prefill){
  if(!D()[kind])return;
  const item=Object.assign({id:uid(),createdAt:Date.now(),updatedAt:Date.now()},NEWITEM[kind](),prefill||{});
  D()[kind].unshift(item);save(true);
  renderNav();renderView(false);
  openEditor(kind,item.id);
  toast('已新建 · 输入即自动保存');
}
function deleteItem(kind,id){
  if(!confirm('确定删除这条记录吗？删除后无法恢复。'))return;
  const arr=D()[kind],i=arr.findIndex(x=>x.id===id);if(i<0)return;
  const it=arr[i];
  if(it.videoLocal)delBlob('v_'+it.id);
  if(videoURLs.has('v_'+it.id)){URL.revokeObjectURL(videoURLs.get('v_'+it.id));videoURLs.delete('v_'+it.id)}
  arr.splice(i,1);save(true);closeDrawer();render();toast('已删除');
}
async function handleVideoFile(file){
  if(!file||!UI.edit)return;
  const item=D()[UI.edit.key].find(x=>x.id===UI.edit.id);if(!item)return;
  if(file.size>80*1024*1024){toast('视频超过 80MB，建议改用视频链接','warn');return}
  toast('正在保存视频到本地…');
  try{
    await putBlob('v_'+item.id,file);
    if(videoURLs.has('v_'+item.id)){URL.revokeObjectURL(videoURLs.get('v_'+item.id));videoURLs.delete('v_'+item.id)}
    item.videoLocal=true;item.videoName=file.name;item.videoSize=file.size;item.videoData='';item.url='';
    save(true);renderDrawer();renderView(false);toast('视频已保存，重开页面依然在 ✓');
  }catch(e){
    if(file.size<1.1*1024*1024){
      const r=new FileReader();
      r.onload=()=>{item.videoData=r.result;item.videoLocal=false;item.videoName=file.name;save(true);renderDrawer();toast('已保存（浏览器限制，使用精简存储）')};
      r.readAsDataURL(file);
    }else toast('浏览器限制了本地视频存储，请改用视频链接','warn');
  }
}
function copyScript(){
  const ed=UI.edit;if(!ed)return;
  const s=D().scripts.find(x=>x.id===ed.id);if(!s)return;
  const txt=[s.title?'【'+s.title+'】':'',s.hook?'开头钩子：\n'+s.hook:'',s.body?'分镜 / 正文：\n'+s.body:'',
    s.caption?'发布文案：\n'+s.caption:'',s.note?'备注：'+s.note:''].filter(Boolean).join('\n\n');
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('脚本已复制到剪贴板 ✓')}catch(e){toast('复制失败，请手动选择','warn')}
  ta.remove();
}

$('#view').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,kind=b.dataset.kind,v=b.dataset.v;
  switch(a){
    case 'new':createItem(kind);break;
    case 'open':openEditor(kind,id);break;
    case 'del':deleteItem(kind,id);break;
    case 'toggle':{
      const t=D().todos.find(x=>x.id===id);if(!t)return;
      t.done=!t.done;t.updatedAt=Date.now();save(true);renderNav();renderView(false);
      if(t.done)toast('完成一件事，真棒 ✨');break;
    }
    case 'star':{
      const i=D().inspirations.find(x=>x.id===id);if(!i)return;
      i.starred=!i.starred;save(true);renderView(false);break;
    }
    case 'filter':UI.filter[UI.page]=v;renderView(false);break;
    case 'goto':go(b.dataset.page);break;
    case 'quickadd':{
      const inp=$('#view [data-quickadd]');if(inp&&inp.value.trim()){addQuick(inp.value.trim());inp.value=''}
      break;
    }
    case 'cal-prev':case 'cal-next':{
      const [y,m]=UI.calMonth.split('-').map(Number);
      const d=new Date(y,m-1+(a==='cal-next'?1:-1),1);
      UI.calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);renderView(false);break;
    }
    case 'cal-today':UI.calMonth=today().slice(0,7);UI.calDay=today();renderView(false);break;
    case 'cal-day':UI.calDay=v;renderView(false);break;
    case 'cal-add':createItem('schedules',{date:UI.calDay});break;
    case 'settings':openSettings();break;
    case 'account':switchAccount(id);break;
    case 'theme':setTheme(id);break;
  }
});

$('#topbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='account')switchAccount(b.dataset.id);
  else if(b.dataset.act==='theme')setTheme(b.dataset.id);
  else if(b.dataset.act==='settings')openSettings();
});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)});
$('#mobileNav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)});
$('#swatches').addEventListener('click',e=>{const b=e.target.closest('[data-theme-pick]');if(b)setTheme(b.dataset.themePick)});
$('.side-tools').addEventListener('click',e=>{if(e.target.closest('[data-side="settings"]'))openSettings()});

$('#drawerRoot').addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.sa!==undefined){
    const a=S.accounts[Number(el.dataset.ai)];
    if(a){a[el.dataset.sa]=el.type==='number'?num(el.value):el.value;save();renderNav();renderTop()}
    return;
  }
  const f=el.dataset.f;if(!f||el.type==='file')return;
  const val=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':Number(el.value)):el.value;
  setField(f,val);
});
$('#drawerRoot').addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='importDataFile'||el.id==='importFile'){if(el.files[0])importData(el.files[0]);return}
  if(el.type==='file'&&el.dataset.f==='videoFile'){handleVideoFile(el.files[0]);return}
  if(el.dataset.sa!==undefined)return;
  const f=el.dataset.f;if(!f)return;
  const val=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':Number(el.value)):el.value;
  setField(f,val);
});
$('#drawerRoot').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='close'){closeDrawer();return}
  if(a==='theme'){setTheme(b.dataset.id);openSettings();return}
  if(a==='seg'){
    const ed=UI.edit;if(!ed)return;
    const it=D()[ed.key].find(x=>x.id===ed.id);if(!it)return;
    it[b.dataset.f]=b.dataset.v;it.updatedAt=Date.now();save(true);renderDrawer();renderView(false);return;
  }
  if(a==='delete'){if(UI.edit)deleteItem(UI.edit.key,UI.edit.id);return}
  if(a==='clear-video'){
    const ed=UI.edit;if(!ed)return;
    const it=D()[ed.key].find(x=>x.id===ed.id);if(!it)return;
    if(it.videoLocal)delBlob('v_'+it.id);
    it.videoLocal=false;it.videoData='';it.videoName='';save(true);renderDrawer();renderView(false);toast('已移除本地视频');return;
  }
  if(a==='copy-script'){copyScript();return}
  if(a==='export'){exportData();return}
  if(a==='import-trigger'){const f=$('#importFile');if(f)f.click();return}
  if(a==='clear-all'){clearAll();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
window.addEventListener('beforeunload',()=>{if(saveTimer){clearTimeout(saveTimer);writeNow()}});

/* ============================================================
   9. 启动
   ============================================================ */
S=load();
document.documentElement.dataset.theme=S.theme;
writeNow();          // 首次打开就把完整数据落到本地
render();
</script>
</body>
</html>
